services:
  - type: web
    name: sap-wms-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: sap-wms-db
          property: connectionString

  - type: web
    name: sap-wms-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sap-wms-backend
          property: url

databases:
  - name: sap-wms-db
    databaseName: sap_almacen_obras
    user: sap_admin
    region: oregon
    plan: free
